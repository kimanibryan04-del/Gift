<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Gift for Little Panda 🎁💖</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ffeef8 0%, #fecfef 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #4a4a4a;
      position: relative;
      overflow-x: hidden;
    }

    /* FLOATING HEARTS BACKGROUND */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* GIFT OPENING OVERLAY */
    #giftOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 238, 248, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.5s ease;
      text-align: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }
    .gift-box {
      font-size: 80px;
      cursor: pointer;
      animation: bounce 1.5s infinite ease-in-out;
      margin-bottom: 20px;
    }
    .open-btn {
      background: #e84393;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(232, 67, 147, 0.4);
      transition: transform 0.2s;
    }
    .open-btn:hover { transform: scale(1.05); }

    /* MAIN CONTAINER */
    .container {
      max-width: 600px;
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 40px;
      animation: fadeIn 0.8s ease;
      position: relative;
      z-index: 1;
    }
    header {
      text-align: center;
      margin-top: 10px;
    }
    header h1 { color: #d63031; font-size: 2rem; margin-bottom: 5px; }
    header p { color: #636e72; font-size: 1rem; }

    /* FEATURED VIDEO PLAYER CARD */
    .player-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(232, 67, 147, 0.15);
      text-align: center;
      backdrop-filter: blur(5px);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #1e1e1e; /* Dark sleek background for portrait videos */
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .video-wrapper video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; /* This prevents cropping and fits the whole video! */

    }
    .sender-info h3 { color: #e84393; font-size: 1.3rem; margin-bottom: 4px; }
    .sender-info p { color: #2d3436; font-style: italic; font-size: 1.05rem; }

    /* REACTION BUTTONS */
    .reactions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    .react-btn {
      background: #fff0f6;
      border: 2px solid #ff85c0;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.1s;
    }
    .react-btn:active { transform: scale(0.9); }

    /* GALLERY GRID */
    .gallery-title {
      font-size: 1.2rem;
      color: #2d3436;
      margin-top: 10px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .thumb-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid transparent;
      backdrop-filter: blur(5px);
    }
    .thumb-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(232, 67, 147, 0.2);
      border-color: #ff85c0;
    }
    .thumb-preview {
      width: 100%;
      height: 90px;
      background: #f1f2f6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 8px;
    }
    .thumb-name { font-weight: 600; font-size: 0.95rem; color: #2d3436; }
    .thumb-relation { font-size: 0.8rem; color: #e84393; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- FLOATING HEARTS BACKGROUND -->
  <div class="bg-hearts" id="heartsContainer"></div>

  <!-- BACKGROUND AUDIO PLAYER (Replace the src with your favorite romantic instrumental or song URL) -->
  <audio id="bgMusic" loop>
    <source src="music/love_is_like_Lagos_traffic(128k).mp3" type="audio/mpeg">
  </audio>

  <!-- GIFT BOX OVERLAY -->
  <div id="giftOverlay">
    <div class="gift-box" onclick="openGift()">🎁</div>
    <h2 style="color: #d63031; margin-bottom: 10px;">A Surprise Video Gift Box!</h2>
    <p style="color: #636e72; margin-bottom: 20px; max-width: 300px;">People gathered to wish you the happiest birthday. Tap below to unwrap!</p>
    <button class="open-btn" onclick="openGift()">Open Your Gift 💝</button>
  </div>

  <!-- MAIN GALLERY CONTENT -->
  <div class="container" id="mainContent">
    <header>
      <h1>Birthday Video Wishes 🎥✨</h1>
      <p>Surround yourself with all the love today, Babe!</p>
    </header>

    <!-- FEATURED VIDEO PLAYER -->
    <div class="player-card">
      <div class="video-wrapper">
        <video id="activeVideo" controls poster="">
          Your browser does not support video playback.
        </video>
      </div>
      <div class="sender-info">
        <h3 id="activeName">Select a video below</h3>
        <p id="activeMessage">"Tap any video card to watch their message!"</p>
      </div>
      <div class="reactions">
        <button class="react-btn" onclick="react('❤️')">❤️ Loved it</button>
        <button class="react-btn" onclick="react('🥳')">🥳 So sweet</button>
        <button class="react-btn" onclick="react('🥺')">🥺 Made me smile</button>
      </div>
    </div>

    <!-- GALLERY GRID -->
    <div class="gallery-title">More Wishes 💌</div>
    <div class="grid" id="videoGrid">
      <!-- Cards will be injected by JavaScript -->
    </div>
  </div>

  <script>
    // Create floating background hearts dynamically
    const heartsContainer = document.getElementById('heartsContainer');
    const heartEmojis = ['💖', '🤍', '🌸', '✨', '💕', '💗'];

    for (let i = 0; i < 20; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      heart.style.fontSize = (16 + Math.random() * 16) + 'px';
      heartsContainer.appendChild(heart);
    }

    // 💡 CUSTOMIZE YOUR VIDEOS AND MESSAGES HERE:
    const videoData = [
      {
        name: "Bryan ❤️",
        relation: "Your Favorite Person ✨",
        src: "video/20261015_014501.mp4",
        message: "Happy Birthday to my sweet baby gurll 🥰 ! Eres todo para mí.🤍"
      },
      {
        name: "Mum-in-law 🙃 ",
        relation: "Mother from another mother &#128514;",
        src: "video/20261014_223240.mp4",
        message: "Wishing you abundant blessings and success in Texas! We are so proud of you!"
      },
      {
        name: "Nisha the baddie 😛",
        relation: "Sisterly love 💖",
        src: "video/20261014_180738.mp4",
        message: "Happy Birthday girlie! Hope you're eating all the cake today 😂;!"
      },
      {
        name: "Cute little Taliah 🥰",
        relation: "Sister from the mother from another mother 😂",
        src: "video/20261014_180543.mp4",
        message: "Happy Birthday Shasha ! Bryan loves calling you so much at night 😁"
      }
    ];

    const bgMusic = document.getElementById('bgMusic');
    const activeVideo = document.getElementById('activeVideo');

    function openGift() {
      // Play background music
      bgMusic.volume = 0.4; // Soft background volume
      bgMusic.play().catch(e => console.log("Audio play blocked by browser policy"));

      document.getElementById('giftOverlay').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('giftOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'flex';
      }, 500);

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 150,
          spread: 90,
          origin: { y: 0.5 }
        });
      }

      loadVideo(0);
    }

    function loadVideo(index) {
      const v = videoData[index];
      document.getElementById('activeName').innerText = v.name;
      document.getElementById('activeMessage').innerText = `"${v.message}"`;
      activeVideo.src = v.src;
      activeVideo.load();
    }

    // Smart Audio Control: Pause BG music when video plays, resume when video ends/pauses
    activeVideo.addEventListener('play', () => {
      if (!bgMusic.paused) {
        bgMusic.pause();
      }
    });

    activeVideo.addEventListener('pause', () => {
      // Resume background music if video is paused and user is done
      if (bgMusic.paused && activeVideo.ended) {
        bgMusic.play().catch(e => {});
      }
    });

    activeVideo.addEventListener('ended', () => {
      bgMusic.play().catch(e => {});
    });

    function renderGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      videoData.forEach((v, idx) => {
        const card = document.createElement('div');
        card.className = 'thumb-card';
        card.onclick = () => {
          loadVideo(idx);
          activeVideo.play();
        };
        card.innerHTML = `
          <div class="thumb-preview">▶️</div>
          <div class="thumb-name">${v.name}</div>
          <div class="thumb-relation">${v.relation}</div>
        `;
        grid.appendChild(card);
      });
    }

    function react(emoji) {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 30,
          spread: 50,
          origin: { y: 0.7 },
          shapes: ['circle']
        });
      }
    }

    window.onload = renderGrid;
  </script>
</body>
</html>
